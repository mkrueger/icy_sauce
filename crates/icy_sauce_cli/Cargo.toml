[package]
name = "icy_sauce_cli"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
description = "Command-line tool for viewing and modifying SAUCE metadata"
homepage.workspace = true
repository.workspace = true
license-file = "../../LICENSE"
keywords = ["ansi", "ansiart", "sauce", "cli"]

[[bin]]
name = "sauce"
path = "src/main.rs"

[dependencies]
icy_sauce = { path = "../icy_sauce" }
clap.workspace = true
bstr.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
